services:
  - type: web
    name: data-portal
    runtime: python
    buildCommand: bash build.sh
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    buildFilter:
      paths:
        - backend/**
        - frontend/**
        - build.sh
        - requirements.txt
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
